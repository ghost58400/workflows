on:
  workflow_call:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge parent into this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PARENT=$(gh api "repos/${{ github.repository }}" --jq .parent.full_name)
          BRANCH=$(gh api "repos/${PARENT}" --jq .default_branch)
          git fetch "https://github.com/${PARENT}.git" "refs/heads/${BRANCH}:refs/remotes/upstream/${BRANCH}"
          git merge "refs/remotes/upstream/${BRANCH}" --no-edit
          git push

# Alternative : https://github.com/wei/pull
